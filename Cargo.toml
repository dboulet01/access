[workspace]
members = ["rust/docking_identity_core"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
ciborium = "0.2.2"
coset = "0.4.2"
ed25519-dalek = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2.0"