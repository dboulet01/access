x-access-environment: &access-environment
  ACCESS_IDENTITIES_FILE: ${ACCESS_IDENTITIES_FILE:-/workspace/config/access/simulation-identities.json}
  ACCESS_TRUST_BUNDLE_FILE: ${ACCESS_TRUST_BUNDLE_FILE:-/workspace/config/access/simulation-trust-bundle.json}
  ACCESS_PROTOCOL_PROFILE_FILE: ${ACCESS_PROTOCOL_PROFILE_FILE:-/workspace/config/access/access-protocol-profile.json}
  ACCESS_AUTHORIZATION_POLICY_BUNDLE_FILE: ${ACCESS_AUTHORIZATION_POLICY_BUNDLE_FILE:-/workspace/config/access/access-authorization-policy-bundle.json}
  ACCESS_AUTHORITY_COMMAND: ${ACCESS_AUTHORITY_COMMAND:-/usr/local/bin/access-authority}
  ACCESS_SIGNER_COMMAND: ${ACCESS_SIGNER_COMMAND:-/usr/local/bin/access-signer}
  ACCESS_STATE_DIR: ${ACCESS_STATE_DIR:-/workspace/state/access-authority}
  ACCESS_AUTHORITY_TIMEOUT_S: ${ACCESS_AUTHORITY_TIMEOUT_S:-5}
  ACCESS_ENTITLEMENT_VERIFIER_COMMAND: ${ACCESS_ENTITLEMENT_VERIFIER_COMMAND:-/usr/local/bin/access-entitlement-verifier}
  ACCESS_ENTITLEMENT_VERIFIER_TIMEOUT_S: ${ACCESS_ENTITLEMENT_VERIFIER_TIMEOUT_S:-5}
  ACCESS_CLIENT_TRUST_BUNDLE_FILE: ${ACCESS_CLIENT_TRUST_BUNDLE_FILE:-/workspace/config/access/simulation-client-trust-bundle.json}
  ACCESS_CLIENT_REPLAY_FILE: ${ACCESS_CLIENT_REPLAY_FILE:-/workspace/state/access-client/consumed-entitlements.log}

x-visual-simulation: &visual-simulation
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: secure-docking-sim:humble-fortress
  command:
    - ros2
    - launch
    - docking_orchestration
    - visual_sim.launch.py
  ipc: host
  stdin_open: true
  tty: true
  volumes:
    - visual-1-state:/workspace/state

services:
  docking-sim:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: secure-docking-sim:humble-fortress
    environment:
      <<: *access-environment
      IGN_PARTITION: docking_baseline
      ROS_DOMAIN_ID: "42"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    command:
      - ros2
      - launch
      - docking_orchestration
      - baseline_sim.launch.py
    ipc: host
    stdin_open: true
    tty: true
    volumes:
      - baseline-state:/workspace/state

  docking-visual-1:
    <<: *visual-simulation
    environment:
      <<: *access-environment
      IGN_PARTITION: docking_visual_1
      ROS_DOMAIN_ID: "43"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp

  docking-visual-2:
    <<: *visual-simulation
    environment:
      <<: *access-environment
      IGN_PARTITION: docking_visual_2
      ROS_DOMAIN_ID: "44"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    volumes:
      - visual-2-state:/workspace/state

  docking-visual-3:
    <<: *visual-simulation
    environment:
      <<: *access-environment
      IGN_PARTITION: docking_visual_3
      ROS_DOMAIN_ID: "45"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    volumes:
      - visual-3-state:/workspace/state

  docking-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: secure-docking-sim:humble-fortress
    command:
      - ros2
      - run
      - docking_orchestration
      - session_gateway
    environment:
      GATEWAY_PORT: "8080"
      SESSION_IDLE_TIMEOUT_S: "60"
      SIMULATION_BACKENDS: docking-visual-1:8080,docking-visual-2:8080,docking-visual-3:8080
    depends_on:
      - docking-visual-1
      - docking-visual-2
      - docking-visual-3
    ports:
      - "127.0.0.1:8080:8080"

  ngrok:
    image: ngrok/ngrok:latest
    command:
      - http
      - docking-gateway:8080
      - --url
      - ${NGROK_DOMAIN:-unisotropous-overmellow-genevieve.ngrok-free.dev}
    environment:
      NGROK_AUTHTOKEN: ${ngrok_authtoken}
    depends_on:
      - docking-gateway
    ports:
      - "127.0.0.1:4040:4040"

volumes:
  baseline-state:
  visual-1-state:
  visual-2-state:
  visual-3-state: